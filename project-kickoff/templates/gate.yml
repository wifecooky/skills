# The watchdog for the local hook: a dead or skipped pre-push still gets caught here, and GitHub mails the failure.
name: gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh scripts/gate.sh
